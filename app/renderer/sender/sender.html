<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Share to computer</title>
  <link rel="stylesheet" href="sender.css">
</head>
<body>
  <main>
    <header>
      <span class="logo"><svg viewBox="0 0 32 32"><rect x="5" y="9" width="15" height="11" rx="2" fill="none" stroke="#fff" stroke-width="2.2"/><rect x="19" y="12" width="8" height="13" rx="1.8" fill="#fff"/><path d="M9 24h8" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></svg></span>
      <div><h1>Share to this computer</h1><p class="muted">Same Wi-Fi network · MirrorDesk</p></div>
    </header>

    <section class="card">
      <label>Screen code <span class="muted">(shown on the computer)</span>
        <input id="code" maxlength="8" autocomplete="off" spellcheck="false" placeholder="e.g. 0A17">
      </label>
      <label>Name of this device
        <input id="name" maxlength="40" spellcheck="false">
      </label>
      <div class="buttons">
        <button id="shareScreen" class="primary">Share screen</button>
        <button id="shareCamera">Share camera</button>
        <button id="stop" class="danger" hidden>Stop sharing</button>
      </div>
      <p id="status" class="status"></p>
      <p class="muted small" id="hint"></p>
    </section>

    <section class="card">
      <h2>Send files to the computer</h2>
      <input type="file" id="files" multiple>
      <div id="uploads" class="list"></div>
    </section>

    <section class="card">
      <h2>Files from the computer</h2>
      <div id="incoming" class="list"><p class="muted small">Type the screen code to see them.</p></div>
      <button id="refresh" class="small-btn">Refresh</button>
    </section>
  </main>
  <script src="sender.js"></script>
</body>
</html>
