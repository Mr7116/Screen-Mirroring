<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob: mediastream:; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>Mirror</title>
  <link rel="stylesheet" href="mirror.css">
</head>
<body>
  <div class="layout">
    <div class="stage" id="stage" tabindex="0">
      <div class="screen-box" id="screenBox">
        <canvas id="view"></canvas>
        <canvas id="wb" class="wb"></canvas>
        <video id="remote" autoplay playsinline muted hidden></video>
      </div>
      <div class="status" id="status"><div class="spinner"></div><div id="statusText">Connecting…</div></div>
      <div class="rec-badge" id="recBadge" hidden><span class="rec-dot"></span><span id="recTime">00:00</span></div>

      <!-- whiteboard tools -->
      <div class="wb-bar" id="wbBar" hidden>
        <button data-tool="brush" class="on" title="Pen"><svg viewBox="0 0 24 24"><path d="M4 20c2-1 3-3 4-5l9-9a2 2 0 0 1 3 3l-9 9c-2 1-4 2-5 4"/></svg></button>
        <button data-tool="highlighter" title="Highlighter"><svg viewBox="0 0 24 24"><path d="M9 15 15 3l5 3-6 12Z"/><path d="M4 21h9"/></svg></button>
        <button data-tool="line" title="Line"><svg viewBox="0 0 24 24"><path d="M5 19 19 5"/></svg></button>
        <button data-tool="arrow" title="Arrow"><svg viewBox="0 0 24 24"><path d="M5 19 19 5M10 5h9v9"/></svg></button>
        <button data-tool="rect" title="Rectangle"><svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="1"/></svg></button>
        <button data-tool="ellipse" title="Ellipse"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="8" ry="6"/></svg></button>
        <button data-tool="text" title="Text"><svg viewBox="0 0 24 24"><path d="M5 6h14M12 6v13"/></svg></button>
        <span class="sep"></span>
        <button id="wbColor" class="color-btn" title="Colour"><span id="wbSwatch"></span></button>
        <div class="swatches" id="swatches" hidden></div>
        <button id="wbUndo" title="Undo"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
        <button id="wbRedo" title="Redo"><svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
        <button id="wbClear" title="Clear all"><svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>
        <button id="wbClose" title="Close whiteboard"><svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7 7 17"/></svg></button>
      </div>

      <!-- text input -->
      <div class="type-bar" id="typeBar" hidden>
        <textarea id="typeInput" rows="1" placeholder="Type here, Enter sends it to the phone, Ctrl+Enter adds a line"></textarea>
        <button class="send" id="typeSend">Send</button>
      </div>

      <!-- phone files -->
      <div class="files-pop" id="filesPop" hidden>
        <div class="fp-head"><b>Phone · Download folder</b><button id="fpClose">✕</button></div>
        <div id="fpList" class="fp-list"></div>
        <div class="fp-foot"><button id="fpSend" class="pill">Send files to phone…</button></div>
      </div>

      <div class="drop" id="drop" hidden><div>Drop files to send them</div></div>
      <div class="toasts" id="toasts"></div>
    </div>

    <aside class="toolbar" id="toolbar">
      <button data-act="fullscreen" title="Full screen"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      <button data-act="screenshot" title="Screenshot"><svg viewBox="0 0 24 24"><path d="M4 8a2 2 0 0 1 2-2h2l1.5-2h5L16 6h2a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2Z"/><circle cx="12" cy="13" r="3.5"/></svg></button>
      <button data-act="recording" title="Record"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.5" class="fill"/></svg></button>
      <button data-act="whiteboard" title="Whiteboard"><svg viewBox="0 0 24 24"><path d="M4 20c2-1 3-3 4-5l9-9a2 2 0 0 1 3 3l-9 9c-2 1-4 2-5 4"/></svg></button>
      <button data-act="keyboard" title="Type to the phone" data-android><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M7 10h.01M11 10h.01M15 10h.01M7 14h10"/></svg></button>
      <button data-act="rotate" title="Rotate"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"/></svg></button>
      <button data-act="rotateLeft" title="Rotate the other way"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.3-5.7M4 4v5h5"/></svg></button>
      <button data-act="topmost" title="Keep on top"><svg viewBox="0 0 24 24"><path d="M9 4h6l-1 6 3 3H7l3-3ZM12 13v7"/></svg></button>
      <button data-act="files" title="Send and get files"><svg viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8Z"/><path d="M14 3v5h5M12 17v-6M9 14l3-3 3 3"/></svg></button>
      <button data-act="folder" title="Open recordings folder"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></svg></button>
      <span class="grow"></span>
      <button data-act="volumeUp" title="Volume up" data-android><svg viewBox="0 0 24 24"><path d="M4 10v4h4l5 4V6L8 10Z"/><path d="M16 9a4 4 0 0 1 0 6M19 6a8 8 0 0 1 0 12"/></svg></button>
      <button data-act="volumeDown" title="Volume down" data-android><svg viewBox="0 0 24 24"><path d="M4 10v4h4l5 4V6L8 10Z"/><path d="M16 9a4 4 0 0 1 0 6"/></svg></button>
      <button data-act="screenOff" title="Phone screen on / off" data-android><svg viewBox="0 0 24 24"><path d="M12 3v8M6.3 6.3a8 8 0 1 0 11.4 0"/></svg></button>
      <span class="divider" data-android></span>
      <button data-act="back" title="Back" data-android><svg viewBox="0 0 24 24"><path d="M17 5 7 12l10 7Z"/></svg></button>
      <button data-act="home" title="Home" data-android><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/></svg></button>
      <button data-act="tasks" title="Recent apps" data-android><svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg></button>
      <button data-act="simpleMode" title="Hide toolbar"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
    </aside>
  </div>
  <button class="show-toolbar" id="showToolbar" hidden title="Show toolbar"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>

  <script src="hotkeys.js"></script>
  <script src="h264.js"></script>
  <script src="whiteboard.js"></script>
  <script src="demo.js"></script>
  <script src="mirror.js"></script>
</body>
</html>
