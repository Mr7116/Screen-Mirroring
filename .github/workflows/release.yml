# Makes a GitHub Release a friend can use: the Windows installer, the iPhone .ipa and the guide.
# Run it from the Actions tab (Run workflow) and type a version, e.g. 1.0.0.
name: Release (Windows + iPhone)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, e.g. 1.0.0"
        required: true
        default: "1.0.0"

permissions:
  contents: write

jobs:
  ios:
    uses: ./.github/workflows/build-ios-unsigned.yml

  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: npm ci

      - name: Set version
        run: npm version "${{ inputs.version }}" --no-git-tag-version --allow-same-version

      - name: Build installer
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false" # no code-signing certificate

      - uses: actions/upload-artifact@v4
        with:
          name: MirrorDesk-windows
          path: app/dist/*.exe
          if-no-files-found: error

  release:
    needs: [ios, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l out
          gh release create "v${{ inputs.version }}" out/*.exe out/*.ipa \
            --title "MirrorDesk ${{ inputs.version }}" \
            --notes-file INSTALL-TH.md
